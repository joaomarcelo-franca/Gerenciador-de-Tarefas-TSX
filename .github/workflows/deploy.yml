name: Deploy no GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O site fica em https://<usuario>.github.io/<repositorio>/,
      # então o Vite precisa saber que a "raiz" é /<repositorio>/
      - name: Gerar o build
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      # O GitHub Pages não conhece as rotas do React Router:
      # um F5 em /task daria 404. Com esta cópia, ele entrega o app
      # e o React Router decide qual página mostrar.
      - name: Fallback para as rotas do React Router
        run: cp dist/index.html dist/404.html

      - name: Enviar o build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
